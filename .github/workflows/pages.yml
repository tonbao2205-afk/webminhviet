# Build website từ src/ và triển khai bản thử nghiệm lên GitHub Pages (tên miền tạm *.github.io).
# Cần bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dist/
        run: npm run build

      - name: Kiểm tra liên kết, ảnh và SEO
        run: npm run check

      # Bản thử nghiệm trên tên miền tạm: chặn Google lập chỉ mục để không trùng với thueminhviet.vn
      - name: Chặn lập chỉ mục bản thử nghiệm
        run: printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
